<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 22" preserveAspectRatio="none" fill="none">
  <!--
    一条可平铺的波浪线（波浪线那一号「领路的那一段」的底图）。
    它只当**形状**用：CSS 拿它做 `mask`，颜色由 `background-color` 给 —— 所以这张图
    只管长得像不像，不管颜色（笔触纯黑只是为了遮罩里「画到的地方不透明」）。

    数值都是相对数（一个波长 48 × 一个波纹 22），由 CSS 的 `mask-size` 按 em 缩放。
    中线 y = 11、振幅 6（`c`/`s` 的控制点取 ±8 = 4/3 × 振幅，正弦的贝塞尔近似）、线粗 10
    —— 于是波峰顶正好落在 y = 0、波谷底正好落在 y = 22，一点不浪费。
    线粗 : 波长 = 10 : 48 ≈ 1 : 4.8，是量过浏览器画 `text-decoration-style: wavy`
    那支笔定的（已读行那条波浪下划线就是它画的，两处得同一个节奏）；振幅 6 比它那支笔
    粗一倍（它约 3）—— 不然在 1× 屏、20px 字号下振幅还不到一个像素，看不出是波浪。
  -->
  <path
    d="M-24 11c8-8 16-8 24 0s8 8 24 0s8-8 24 0s8 8 24 0"
    stroke="#000000"
    stroke-width="10"
  />
</svg>
